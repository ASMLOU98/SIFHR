<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧙 Test API Sifhr</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1a1a2e;
            color: #e6e6e6;
        }
        
        h1 {
            color: #00adb5;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .section {
            background-color: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #00adb5;
        }
        
        .section h2 {
            color: #00adb5;
            margin-top: 0;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #393e46;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            font-size: 16px;
        }
        
        textarea {
            height: 100px;
            resize: vertical;
        }
        
        button {
            background-color: #00adb5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #009199;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .response-box {
            background-color: #0f3460;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            min-height: 50px;
            border-left: 3px solid #00adb5;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .status.ok {
            background-color: #1e3c1e;
            border-left: 4px solid #4CAF50;
        }
        
        .status.error {
            background-color: #3c1e1e;
            border-left: 4px solid #f44336;
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .info {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>🧙 Test API Sifhr - Gardien du Monde</h1>
    
    <!-- Section Status API -->
    <div id="status" class="status">
        Vérification de l'API en cours...
    </div>
    
    <!-- Section Chat -->
    <div class="section">
        <h2>💬 Chat avec Sifhr</h2>
        
        <div>
            <label for="sessionId">ID de Session:</label>
            <input type="text" id="sessionId" value="session-test" placeholder="Identifiant de session">
        </div>
        
        <div>
            <label for="userMessage">Votre message:</label>
            <input type="text" id="userMessage" 
                   value="Bonjour Sifhr, qui es-tu ?" 
                   placeholder="Posez votre question au gardien...">
        </div>
        
        <div class="button-group">
            <button onclick="sendMessage()">Envoyer au Chat</button>
            <button onclick="sendMessageWithAudio()">Envoyer + Audio</button>
            <button onclick="clearHistory()">Effacer l'historique</button>
        </div>
        
        <div class="response-box" id="chatResponse">
            La réponse de Sifhr apparaîtra ici...
        </div>
        
        <audio id="chatAudio" controls style="display: none;">
            Votre navigateur ne supporte pas l'audio.
        </audio>
    </div>
    
    <!-- Section TTS Direct -->
    <div class="section">
        <h2>🎵 Test TTS Direct</h2>
        
        <div>
            <label for="ttsText">Texte à convertir en audio:</label>
            <textarea id="ttsText">Je suis Sifhr, gardien des ombres anciennes. Mes paroles résonnent dans les halls oubliés du royaume éternel.</textarea>
        </div>
        
        <div class="button-group">
            <button onclick="generateTTS()">Générer MP3</button>
            <button onclick="playLastAudio()">Rejouer dernier audio</button>
        </div>
        
        <div class="response-box" id="ttsResponse">
            Résultat TTS...
        </div>
        
        <audio id="ttsAudio" controls style="display: none;">
            Votre navigateur ne supporte pas l'audio.
        </audio>
    </div>
    
    <!-- Section Historique -->
    <div class="section">
        <h2>📜 Historique des sessions</h2>
        <div class="response-box" id="historyList">
            Chargement...
        </div>
        <div class="button-group">
            <button onclick="listSessions()">Rafraîchir la liste</button>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:5000';
        let lastAudioUrl = null;
        
        // Vérifier l'état de l'API au chargement
        window.onload = checkAPIStatus;
        
        // Vérifier si l'API est disponible
        async function checkAPIStatus() {
            const statusDiv = document.getElementById('status');
            
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.className = 'status ok';
                    statusDiv.innerHTML = `
                        ✅ API Sifhr en ligne<br>
                        Modèle: ${data.model || 'llama-3.1-8b-instant'}<br>
                        Format: ${data.format || 'Paragraphe fluide'}
                    `;
                } else {
                    throw new Error('API non disponible');
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    ❌ API non accessible<br>
                    Assurez-vous que le serveur est lancé sur ${API_BASE_URL}<br>
                    Erreur: ${error.message}
                `;
            }
        }
        
        // Envoyer un message au chat
        async function sendMessage() {
            const message = document.getElementById('userMessage').value;
            const sessionId = document.getElementById('sessionId').value || 'default';
            
            if (!message.trim()) {
                alert('Veuillez entrer un message');
                return;
            }
            
            const responseDiv = document.getElementById('chatResponse');
            responseDiv.innerHTML = '⏳ Sifhr réfléchit...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.reply) {
                    responseDiv.innerHTML = `
                        <strong>Sifhr répond:</strong><br><br>
                        ${data.reply}<br><br>
                        <em>Session: ${data.session_id}</em>
                    `;
                } else {
                    responseDiv.innerHTML = `❌ Erreur: ${data.error || 'Réponse invalide'}`;
                }
            } catch (error) {
                responseDiv.innerHTML = `❌ Erreur de connexion: ${error.message}`;
            }
        }
        
        // Envoyer un message avec génération audio
        async function sendMessageWithAudio() {
            const message = document.getElementById('userMessage').value;
            const sessionId = document.getElementById('sessionId').value || 'default';
            
            if (!message.trim()) {
                alert('Veuillez entrer un message');
                return;
            }
            
            const responseDiv = document.getElementById('chatResponse');
            responseDiv.innerHTML = '⏳ Sifhr prépare sa réponse...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.reply && data.audio_url) {
                    responseDiv.innerHTML = `
                        <strong>Sifhr répond:</strong><br><br>
                        ${data.reply}<br><br>
                        <em>Session: ${data.session_id}</em>
                    `;
                    
                    // Jouer l'audio
                    const audioPlayer = document.getElementById('chatAudio');
                    audioPlayer.src = `${API_BASE_URL}${data.audio_url}`;
                    audioPlayer.style.display = 'block';
                    lastAudioUrl = `${API_BASE_URL}${data.audio_url}`;
                    
                    // Auto-play
                    audioPlayer.play().catch(e => {
                        console.log('Auto-play bloqué:', e);
                        responseDiv.innerHTML += '<br><br><em>Cliquez sur le lecteur pour écouter</em>';
                    });
                    
                } else {
                    responseDiv.innerHTML = `❌ Erreur: ${data.error || 'Réponse invalide'}`;
                }
            } catch (error) {
                responseDiv.innerHTML = `❌ Erreur de connexion: ${error.message}`;
            }
        }
        
        // Générer du TTS direct
        async function generateTTS() {
            const text = document.getElementById('ttsText').value;
            
            if (!text.trim()) {
                alert('Veuillez entrer un texte');
                return;
            }
            
            const responseDiv = document.getElementById('ttsResponse');
            responseDiv.innerHTML = '⏳ Génération audio en cours...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/tts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text
                    })
                });
                
                const data = await response.json();
                
                if (data.audio_url) {
                    responseDiv.innerHTML = '✅ Audio généré avec succès!';
                    
                    // Jouer l'audio
                    const audioPlayer = document.getElementById('ttsAudio');
                    audioPlayer.src = `${API_BASE_URL}${data.audio_url}`;
                    audioPlayer.style.display = 'block';
                    lastAudioUrl = `${API_BASE_URL}${data.audio_url}`;
                    
                    // Auto-play
                    audioPlayer.play().catch(e => {
                        console.log('Auto-play bloqué:', e);
                        responseDiv.innerHTML += '<br><br><em>Cliquez sur le lecteur pour écouter</em>';
                    });
                    
                } else {
                    responseDiv.innerHTML = `❌ Erreur: ${data.error || 'Génération échouée'}`;
                }
            } catch (error) {
                responseDiv.innerHTML = `❌ Erreur de connexion: ${error.message}`;
            }
        }
        
        // Rejouer le dernier audio
        function playLastAudio() {
            if (lastAudioUrl) {
                const audioPlayer = document.getElementById('ttsAudio');
                audioPlayer.src = lastAudioUrl;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
            } else {
                alert('Aucun audio généré récemment');
            }
        }
        
        // Effacer l'historique (simulation)
        function clearHistory() {
            const sessionId = document.getElementById('sessionId').value || 'default';
            if (confirm(`Effacer l'historique de la session "${sessionId}" ?`)) {
                document.getElementById('chatResponse').innerHTML = '✅ Historique effacé (côté client)';
                document.getElementById('historyList').innerHTML = 'Aucune session active';
                
                // Note: Dans la vraie API, vous pourriez ajouter un endpoint /clear-history
                fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: '[RESET]',
                        session_id: sessionId
                    })
                }).catch(() => {
                    // Ignorer les erreurs pour le reset
                });
            }
        }
        
        // Lister les sessions (simulation)
        function listSessions() {
            document.getElementById('historyList').innerHTML = `
                <strong>Sessions actives:</strong><br>
                • ${document.getElementById('sessionId').value || 'default'} (actuelle)<br>
                • session-test<br>
                • user-123<br>
                <br>
                <em>Note: Les sessions sont gérées côté serveur</em>
            `;
        }
        
        // Permettre d'envoyer avec Entrée
        document.getElementById('userMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
